[mypy]
python_version = 3.10
strict = True
warn_unused_configs = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-numpy.ctypeslib.*]
ignore_errors = True
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-google.api_core.*]
ignore_missing_imports = True