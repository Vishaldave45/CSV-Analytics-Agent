[project]
name = "csv-analytics-agent"
version = "0.1.0"
description = "Production-grade CSV Analytics Agent"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydantic",
    "pydantic-settings",
    "pandas",
    "numpy",
    "matplotlib",
    "langgraph",
    "langchain-core",
    "langchain-google-genai",
    "faiss-cpu",
    "sentence-transformers",
    "tenacity",
    "streamlit>=1.61.1",
    "structlog",
    "pyrate-limiter",
    "sqlalchemy>=2.0",
    "alembic",
]


[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "pandas-stubs",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_analytics_agent"]

[tool.pyright]
include = ["src", "streamlit_app", "tests"]
executionEnvironments = [
  { root = "." }
]
extraPaths = [".", "src"]
